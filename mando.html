<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f12" />
    <title>joe doe · mando</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="top">
      <span class="brand">joe doe <b>mando</b></span>
      <span id="state" class="state">…</span>
    </header>
    <nav id="tabs" class="tabs" hidden>
      <button id="tab-music" class="tab" type="button" aria-pressed="true"></button>
      <button id="tab-video" class="tab" type="button" aria-pressed="false"></button>
    </nav>
    <main id="music" class="board">
      <section id="xy" class="xy" aria-label="XY"><span id="xy-dot" class="xy-dot"></span><span id="xy-hint" class="xy-hint"></span></section>
      <section id="pads" class="pads"></section>
      <section id="knobs" class="knobs"></section>
    </main>
    <main id="video" class="board-video" hidden>
      <section id="clips" class="clips"></section>
      <div class="mix">
        <span id="layers-label" class="mix-label"></span>
        <div id="layers" class="layers"></div>
        <label class="glitch"><span id="glitch-label">Glitch</span><input id="glitch" type="range" min="0" max="1" step="0.01" value="0" /></label>
      </div>
      <label class="fader">
        <b>A</b>
        <input id="fader" type="range" min="0" max="1" step="0.01" value="0" />
        <b>B</b>
      </label>
    </main>
    <script type="module" src="/src/mando.ts"></script>
  </body>
</html>
