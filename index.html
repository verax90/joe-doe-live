<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Live coding studio in the browser: Strudel, Hydra and MIDI." />
    <meta name="theme-color" content="#12151c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>joe doe · live</title>
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="https://joedoe.dev/music" title="Back to joedoe.dev" data-i18n-title="backHome">
        <span class="brand-name">joe doe</span><span class="brand-dot">·</span><span class="brand-live">live</span>
      </a>

      <div class="bar-group">
        <label class="visually-hidden" for="preset" data-i18n="pattern">Pattern</label>
        <select id="preset" class="control"></select>
        <button id="save" class="control" type="button" title="Save in this browser" data-i18n="save" data-i18n-title="saveTitle">Save</button>
        <button id="delete" class="control" type="button" title="Delete the saved pattern" data-i18n="delete" data-i18n-title="deleteTitle" hidden>Delete</button>
      </div>

      <div class="bar-group">
        <label class="visually-hidden" for="visual" data-i18n="visual">Visual</label>
        <select id="visual" class="control" title="Visuals" data-i18n-title="visuals"></select>
        <button id="share" class="control" type="button" data-i18n="share">Share</button>
      </div>

      <div class="bar-group">
        <button id="play" class="control control-accent" type="button" aria-keyshortcuts="Control+Enter">▶ Play</button>
        <button id="stop" class="control" type="button" aria-keyshortcuts="Control+.">■ Stop</button>
      </div>

      <div class="bar-group">
        <button id="toggle-code" class="control" type="button" aria-pressed="true" aria-keyshortcuts="Control+Shift+H" data-i18n="code">Code</button>
        <button id="toggle-tools" class="control" type="button" aria-pressed="false" data-panel="tools" data-i18n="tools">Tools</button>
        <button id="toggle-samples" class="control" type="button" aria-pressed="false" data-panel="samples" data-i18n="samples">Samples</button>
        <button id="toggle-midi" class="control" type="button" aria-pressed="false" data-panel="midi">
          MIDI <span id="midi-dot" class="dot" aria-hidden="true"></span>
        </button>
        <button id="lang" class="control control-lang" type="button" aria-label="Español" data-i18n-label="langSwitch">
          <span class="lang-option" data-lang="en">EN</span><span class="lang-option" data-lang="es">ES</span>
        </button>
      </div>
    </header>

    <main class="stage">
      <section class="editor" id="editor">
        <strudel-editor id="repl"></strudel-editor>
      </section>

      <div id="status" class="status" role="status" aria-live="polite" hidden>
        <p class="status-text"></p>
        <p class="status-detail"></p>
      </div>

      <section class="embed" id="embed" hidden aria-labelledby="embed-title">
        <header class="embed-bar">
          <h2 id="embed-title" class="embed-title"></h2>
          <a id="embed-open" class="control embed-link" href="#" target="_blank" rel="noopener" data-i18n="openInTab">Open in tab ↗</a>
          <button id="embed-close" class="control" type="button" data-i18n="close">Close</button>
        </header>
        <iframe
          id="embed-frame"
          class="embed-frame"
          title="Embedded tool"
          data-i18n-title="embeddedTool"
          src="about:blank"
          allow="autoplay; midi; microphone; clipboard-read; clipboard-write; fullscreen"
        ></iframe>
      </section>

      <aside class="panel" id="tools" hidden>
        <h2 data-i18n="tools">Tools</h2>
        <p class="panel-help" data-i18n-html="toolsHelp"></p>
        <div id="tool-list"><p class="muted" data-i18n="loading">Loading…</p></div>
      </aside>

      <aside class="panel" id="samples" hidden>
        <h2 data-i18n="samples">Samples</h2>
        <p class="panel-help" data-i18n-html="samplesHelp"></p>
        <label class="control file-button">
          <span data-i18n="chooseFiles">Choose files</span>
          <input id="sample-input" type="file" accept="audio/*,.wav,.mp3,.ogg,.flac,.aif,.aiff" multiple />
        </label>
        <p id="sample-status" class="panel-status" role="status"></p>
        <h3 data-i18n="yourSamples">Your samples</h3>
        <ul id="sample-list" class="panel-list sample-list"></ul>
      </aside>

      <aside class="panel" id="midi" hidden>
        <h2>MIDI</h2>
        <p class="panel-help" data-i18n-html="midiHelp"></p>
        <h3 data-i18n="devices">Devices</h3>
        <ul id="midi-devices" class="panel-list"><li class="muted" data-i18n="noPermission">No permission yet</li></ul>
        <button id="midi-enable" class="control" type="button" data-i18n="enableMidi">Enable MIDI</button>
        <h3 data-i18n="lastMessages">Last messages</h3>
        <ol id="midi-log" class="panel-list midi-log"></ol>
      </aside>
    </main>

    <div class="drop-hint" aria-hidden="true" data-i18n="dropHere">Drop your samples here</div>

    <footer class="foot">
      <span data-i18n="shortcuts">Ctrl+Enter play · Ctrl+. stop · Ctrl+Shift+H hides the code</span>
      <a href="https://github.com/verax90/joe-doe-live" data-i18n="source">Source code (AGPL-3.0)</a>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
